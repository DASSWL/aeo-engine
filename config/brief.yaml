# 每日 10:00 简报配置 —— AEO Engine daily_brief
#
# 依据：运行手册页「📖 AEO Engine v1」
#   https://app.notion.com/p/3b3059d969338114a498df06ba197332
# 该页的「一、运行时刻表」与「二、需要你做的事」是每日与每周节奏的唯一事实源。
# 本文件是那两节的机器可读副本，改节奏先改那一页，再同步这里。
#
# 纪律同 Phase 1/2/3：脚本内不出现任何一句文案、任何一个数字。
# scripts/daily_brief.py 只做「取数 + 套模板 + 数行数」，零 LLM。
#
# 零 LLM 的理由（硬约束）：拼装任务不需要生成。确定性和零额度消耗比漂亮措辞重要，
# 而且这条任务兼任心跳——它必须在 claude 登录态失效、API 额度耗尽时照样能跑出来。

meta:
  job: daily_brief
  cron: "0 10 * * *"
  timezone: "America/Los_Angeles"
  source_of_truth: "https://app.notion.com/p/3b3059d969338114a498df06ba197332"

# ---------------------------------------------------------------------------
# 渲染约束
# ---------------------------------------------------------------------------
render:
  # 硬上限。手机一屏读完是这条简报存在的前提——读不完就没人读。
  # 超限时脚本先压掉空行，仍超限则截断并留下 overflow_marker（截断必须看得见）。
  max_lines: 25
  overflow_marker: "…（超出 {max} 行上限已截断，完整版见 outbox 原文）"
  header: "☀️ AEO Engine · 今日简报 {date}（{weekday}）"
  weekday_names: ["周一", "周二", "周三", "周四", "周五", "周六", "周日"]
  # 某项为 0 时整行省略——固定三件事除外（见 sections.actions.fixed）。
  # 逐行显示「0 条」是凑格式，不是信息。
  omit_zero_rows: true

# ---------------------------------------------------------------------------
# 取数口径
#
# 字段名与取值逐字取自 Phase 0 核对清单，与 sla_check.py / draft_runner.py 同源。
# 放在这里而不是写进脚本，理由同 thresholds.yaml：改口径只该改一个地方。
# ---------------------------------------------------------------------------
data:
  # 水箱「状态」= inbox → 待甄别
  pipeline_inbox_status: "inbox"
  # 台账「状态」= 草稿 → 待签发（与 sla_check.py 规则四同一口径）
  ledger_draft_status: "草稿"
  # 08:00 sla_check 的当日结果文件名，超时数从这里读，本脚本不重算
  sla_log_template: "sla_{date}.json"
  sla_total_key: "total_overdue"

# ---------------------------------------------------------------------------
# 时刻表
#
# days 用 ISO 星期编号：1=周一 … 7=周日。
#
# ⚠️ 2026-08-05 落成时的一处口径分歧，需 Shawn 拍板（见 README「遗留问题」）：
#    交付要求里写的是「周末只剩探测与回执监听」，但运行手册页的每日表没有标工作日限定，
#    三个 OpenClaw 任务的 cron 也都是 `* * *`（daily_sla / j4_draft_runner / j4_reply_poll
#    七天都跑），两个 Claude scheduled task 同理。
#    这里按**事实**配：全部 7 天。周末简报因此只比工作日短「周一批扫 / 周五复盘」那一行。
#    若要让周末真的只剩探测与回执监听，是两步，缺一不可：
#      1. 把下面 08:00 / 08:30 / 08:45 / 09:30 四条的 days 改成 [1,2,3,4,5]
#      2. 同时把那四个定时任务的 cron 也改成工作日
#    只改本文件会让简报说谎——任务照跑，简报说它不跑。
#
# 本条 10:00 简报自身不列进表里：你正在读的就是它，列出来是一行噪音。
schedule:
  daily:
    - time: "08:00"
      sort: "08:00"
      label: "时限检查"
      one_liner: "四类超时扫描，有超时才出声"
      days: [1, 2, 3, 4, 5, 6, 7]
    - time: "08:30"
      sort: "08:30"
      label: "触达草稿"
      one_liner: "扫待触达队列，按角色选切入角备好草稿"
      days: [1, 2, 3, 4, 5, 6, 7]
    - time: "08:45"
      sort: "08:45"
      label: "冷邮件回流"
      one_liner: "轮询 Apollo 回复，sequence 未激活期间空转"
      days: [1, 2, 3, 4, 5, 6, 7]
    - time: "09:00"
      sort: "09:00"
      label: "AI 引擎探测"
      one_liner: "两套问题各 5 条问 ChatGPT / Perplexity / Gemini"
      days: [1, 2, 3, 4, 5, 6, 7]
    - time: "09:30"
      sort: "09:30"
      label: "LinkedIn 日小扫"
      one_liner: "扫自己帖子的互动者与 profile 访客"
      days: [1, 2, 3, 4, 5, 6, 7]
    - time: "全天"
      sort: "23:59"
      label: "回执监听"
      one_liner: "只认你本人发的「sent 行ID」"
      days: [1, 2, 3, 4, 5, 6, 7]

  # 周节点。既进①当天清单，也是③「本周节点」倒计时的唯一来源——
  # 两处共用这一份，不各写一遍日子，免得改了一处漏另一处。
  weekly:
    - time: "10:00"
      sort: "10:00"
      label: "周批扫"
      one_liner: "LinkedIn 三组搜索加 Reddit 存量帖，首月盯跑"
      days: [1]
    - time: "15:00"
      sort: "15:00"
      label: "复盘包"
      one_liner: "七节复盘包，留 30 分钟拍板"
      days: [5]

# ---------------------------------------------------------------------------
# 四节
# ---------------------------------------------------------------------------
sections:
  machine:
    title: "① 今天机器会跑什么"
    line: "{time} {label} · {one_liner}"
    # 时刻表全被 days 过滤空时的兜底（当前配置下不会发生，留着免得改 days 后出空节）
    empty: "今天没有排定的自动任务。"

  actions:
    title: "② 你今天的动作"
    # 固定三件：出处为运行手册页「二、需要你做的事 · 每天」。
    # 这三件与数字无关，永远显示，不参与省略规则。
    fixed:
      - "· 收到草稿 → 改一改 → 亲手发出 → 回「sent 行ID」"
      - "· 水箱 inbox 甄别：值得跟的转 Named，不值得的淘汰"
      - "· 有对话的日子：24 小时内填 win/loss"
    # 动态数字：为 0 即整行省略。
    dynamic:
      drafts_pending:
        line: "· 待发草稿 {n} 条"
        # 只给最紧的那一条，且只给三个字段。给多了就成了 08:30 那三条消息的重复。
        urgent_line: "  最紧一条：{name}｜{company}｜{remaining}"
        remaining_left: "剩余 {h}h"
        remaining_overdue: "已逾期 {h}h"
        unknown_name: "(无名)"
        unknown_company: "(无公司)"
      inbox_pending:
        line: "· inbox 待甄别 {n} 条"
      ledger_pending:
        line: "· 台账待签发 {n} 条"
      overdue:
        # 只给计数。详情以 08:00 推送为准，简报重复展开就是第三份噪音。
        line: "· 超时 {n} 条（详情见 08:00 推送）"
        # 08:00 没留下结果 ≠ 没有超时。这一行是心跳的一部分，永不省略。
        missing: "· ⚠️ 08:00 时限检查今天没有留下结果，超时数未知——去查 Mac Mini"

  week:
    title: "③ 本周节点"
    item: "{label} {when}"
    joiner: "　·　"
    today_word: "就在今天"
    future_word: "还有 {n} 天"

  # 固定末行。只给链接，不解析其内容——挂账清单是给人读的，不是给简报复述的。
  tail:
    line: "挂账清单：{url}"
    url: "https://app.notion.com/p/3b1059d9693380c5ad28da3547f2ef02"

# ---------------------------------------------------------------------------
# 失败上报
#
# 这条任务兼任心跳：简报每天必发，静默就是故障。
# 脚本失败、取数失败、渲染为空——三种情况都走这里，都产出一条推得出去的消息。
# 绝不允许「出错了所以今天没消息」。
# ---------------------------------------------------------------------------
failure:
  header: "⚠️ AEO Engine · 今日简报生成失败 {date}（{weekday}）"
  body:
    - ""
    - "时间：{stamp}"
    - ""
    - "错误："
    - "{error}"
    - ""
    - "今天没有简报。这条消息本身就是心跳：你收到它，说明定时任务还活着，"
    - "只是取数或渲染挂了。真正该担心的是 10:00 什么都没收到。"
    - ""
    - "① 的自动任务清单不受影响，那几个任务是各自独立的定时任务。"
    - "② 的数字请直接去 Notion 看：水箱 inbox 视图、台账待签发视图。"
  empty_render: "渲染结果为空——这不是「今天没事」，是模板或取数出了问题。"
