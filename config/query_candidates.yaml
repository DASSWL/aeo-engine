# AEO Engine · AI 建议 query 链的规则
#
# 这条链干什么：每日探测跑完之后，向同一个引擎追问一句「跟刚才那条相关的问题，
# 人们还常问哪些」，把它逐字给出的问法收进来，作为 query 候选。
#
# ⚠️ 这条链的定位必须说清楚，否则它就退化成「让模型生成一批 query」——
#    那正是 2026-08-05 诊断要解决的问题本身。
#
#    AI 建议是**假设源**，不是证据。Keyword Planner 的真实月搜索量才是证据。
#    Shawn 2026-08-05 拍板：候选**直接进 Query 库**标「候选」、月搜索量留空，
#    等 KP 数据回来再补量。所以 Query 库里会同时存在
#    「有人真的搜过的词」和「模型说人们会这么搜的词」两类。
#
#    这两类靠 `数据来源` 区分：本链一律写「AI 建议」（Phase 0 字段表
#    2026-08-05 解冻，additive 加了「A1 扫描」与「AI 建议」两个取值）。
#    **拿 Query 库排 AEO 内容优先级时，必须先看这一列。**
#    月搜索量为空 + 数据来源=AI 建议 = 一条还没有任何市场证据的假设。

meta:
  version: "0.1"
  status: approved            # 整份【推演待校准】：追问措辞与两个上限都没有实测支撑
  drafted_at: "2026-08-05"
  drafted_for: "Query 库进料链：AI 建议路径（Shawn 2026-08-05 指定新增）"
  reviewed_by: Shawn
  reviewed_at: "2026-08-05"

data_source_value: "AI 建议"     # Phase 0 冻结取值，逐字

followup:
  # 追问原文。**逐字使用，不即兴改写**——理由同探测问题本身：
  # 改了措辞，前后几天的产出就不可比，而这条链的产出会进 Query 库当选题依据。
  #
  # 措辞刻意不提任何品类词（不说 video search、不说 asset management）：
  # 话题由刚问过的那条探测问题自己带出来。我们每多塞一个词，
  # 拿回来的就多一分是我们自己的假设、少一分是它观察到的提问分布。
  text: >-
    What other questions do people commonly ask you that are related to the one
    I just asked? List only the exact phrasings people use, one per line,
    with no numbering, no explanation, and no commentary.

  # 什么时候问：每个引擎、每个问题集，在**该问题集最后一条探测问题的记录写完之后**
  # 各追问一次。当前 = 2 引擎 × 2 问题集 = 4 次/天
  # （2026-08-07 Perplexity 移出探测，引擎数以 scan.yaml: probe.engines 为准）。
  #
  # 不是每条探测问题都追问（那是 20 次/天）：追问的回答质量不随次数线性增长，
  # 但噪音和写库量会。
  cadence: "每引擎每问题集各一次（在该问题集最后一条记录写完之后）"

  # 追问必须在探测记录写完之后。理由是 playbook §3.2 那条：
  # 同一对话里的上下文会带偏后续回答。追问放在最后，被污染的只有追问自身
  # （它的产出本来就只是待验证假设），探测基线不受影响。
  # 追问之后该对话即结束，**不得再问第二条探测问题**。
  position: "该对话的最后一步，探测记录写完之后"

filters:
  # 长度闸。太短的不是 query，太长的不是任何人会打进搜索框的东西。
  # 【推演待校准】：两个数无实测支撑，首批候选出来后由真人调。
  min_words: 3
  max_words: 16

  # 命中即丢弃。这些是关于**我们**的句子，或者是模型的解释性文字，不是提问分布。
  exclude_markers:
    - "here are"
    - "these are"
    - "for example"
    - "such as"
    - "i hope this helps"
    - "let me know"

caps:
  # 每次追问最多收几条。模型给 30 条时，后面那些是它在凑数，不是它观察到的高频。
  max_per_ask: 5
  # 每天最多写进 Query 库几条。
  #
  # 这道闸是本链**最重要**的一道，理由是算术：
  # 4 次追问 × 5 条 = 20 条/天，一个月 600 条未验证的模型建议，
  # 而 Query 库现在只有 10 条真实行。不设上限，两个月后 J1 从这个库里
  # 挑选题，挑到的 99% 是模型的联想。
  #
  # 被上限截掉的**不静默丢弃**：留在 data/query_candidates.jsonl 里，
  # 并在运行输出里点名说截了几条、截了哪些。
  max_per_day: 20

notes:
  - "本链零对外成本：追问在既有探测对话里进行，不新增任何按量计费调用。"
  - "候选池 data/query_candidates.jsonl 是 append-only 的出处留档——
     Query 库 7 个冻结字段装不下「这条是哪个引擎、哪天、追问哪条问题得来的」，
     只能落在这里。同 SERP 与买家原话撞的是同一堵墙。"
  - "⚠️ keyword_volume.py:299-301 在补搜索量时会把 `数据来源` 覆写成
     「Keyword Planner」，那会抹掉本链刚标上的「AI 建议」。
     KP 环节上线之前必须先处置这一条，否则解冻换来的出处区分当场归零。"
