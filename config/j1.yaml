# ---------------------------------------------------------------------------
# J1 AEO 内容产线(j1_runner.py)的全部业务值。
#
# 出处:Build Spec · Phase 3「J1 证据生产」+ 2026-08-06 Shawn 拍板
# 「把流程建立起来,同时计入台账」。
#
# 与 J4 的 outreach.yaml 同一哲学:脚本内不写死任何业务值。
# 闸门本身不在这里——闸门只存在于 j1_evidence.py(证据解析)与 gates.yaml(邻域),
# 本文件只管队列怎么排、证据怎么筛、产出怎么落。
# ---------------------------------------------------------------------------

queue:
  # 只自动产这一类。评估式选题涉及竞品对比口径,对比页有邻域闸门,都等真人。
  types_allowed: ["痛点级任务式"]
  # 数据来源白名单:只有「市场在问」形态的来源能当选题。
  # Keyword Planner / SERP 观察刻意不在内——那两条链是补量与占位观察,
  # 进来的是短头词(如 yahoo search video),不是能回答的问法。
  # 首轮 dry-run(2026-08-06)实测:不加这条白名单,队列头两名就是 KP 导航词。
  # 这就是裁决①的代价那句话:「排 AEO 内容优先级前必须先看数据来源列」。
  sources_allowed: ["探测问题", "A1 扫描", "买家原话", "AI 建议", "Search Console"]
  # 状态黑名单(命中即跳过)。Query 库当前用「候选」等值,黑名单比白名单稳:
  # 将来加新状态值时默认进队列,归档类值加进这里。
  statuses_exclude: ["已归档"]
  # 每次运行最多写几篇。
  #
  # 2026-08-12 Shawn 拍板:目标 3 篇/天,先跑两周看质量。
  # 配套改动:cron aeo_j1_draft 由「周三 09:00」改「每天 09:00」。
  #
  # 为什么是「日频 × 3」而不是「一天跑三次 × 1」:run_j1_draft.sh 的中间产物
  # (logs/j1_prompt_<日期>.md、j1_claude_<日期>.txt、j1_runner_plan_<日期>.json)
  # 全部按**日期**戳命名。一天跑三次会互相覆盖,prompt 与 claude 原始输出
  # 都留不下证据——出了问题无法回溯是哪一次写的。
  #
  # 原值 2 与它的理由(周频 × 2,签发是真人动作,产得比签得快只会堆库存)
  # 保留在这里:这条顾虑没有消失,只是 Shawn 决定先用两周数据来验证它。
  max_per_run: 3

evidence:
  # 信号原文里带这些标记的行不进证据候选——那不是本人说的话,是名单命中条件。
  # 与 J4 evidence_gate 对 Apollo 行的降级判定同一出处(outreach.yaml)。
  exclude_markers: ["非原文引用"]
  # 进 prompt 的证据候选上限。太多会稀释配对质量,而且 quote 全文很长。
  max_candidates_in_prompt: 12
  # 每条 quote 进 prompt 的截断长度(字符)
  quote_max_chars: 300

  # -------------------------------------------------------------------------
  # 降级证据源。【出处:Shawn 2026-08-12 拍板「放宽生产条件,如果没有水箱可用的,
  # 从 ai probe 和 keywords query 找相关」】
  #
  # 为什么要:水箱 109 行里能当证据的只有 15 条——83 条带「非原文引用」标记
  # (Apollo 名单命中,不是本人发言)、11 条缺原话或缺链接。而进 prompt 的上限是 12,
  # 于是几乎每篇文章看到的都是同一批证据。已发布 3 篇总共只用了 3 条不同的 SIG。
  # 可用证据最后一次新增是 2026-08-09(2 条);08-10 进来 33 行,一条可用的都没有。
  #
  # ⚠️ 三档证据**不是同一种东西**,这一点必须一路传到 prompt、台账和 outbox 头部,
  #    否则「挂了证据编号」会变成一句空话:
  #      SIG(水箱) —— 买家**本人说的话**。唯一能校准痛点形态的东西。
  #      PRB(探测) —— **引擎生成的内容**。它说明「现在搜这个问题的人会看到什么答案」,
  #                    即这篇文章要压过谁。**不是买家痛点,更不是产品事实。**
  #      KW (Query 库) —— 一个**检索需求信号**。它说明有人搜这个词,
  #                    **不说明他为什么搜、也不说明他难在哪**。
  #
  #    把 PRB 当买家痛点用,等于拿 ChatGPT 对买家的猜测冒充买家的话;
  #    把 PRB 里的产品描述当事实用,等于把引擎的幻觉洗进 vivu.ai 的正文。
  #    facts.json 仍然是正文里产品事实的**唯一**来源,这条一个字没松。
  # -------------------------------------------------------------------------
  fallback:
    enabled: true
    # 降级证据只在水箱一条都配不上时用。这是 prompt 里的规则(靠 claude 判相关),
    # 脚本这边只负责把三档都递进去并标清楚档位——相关不相关是判断,不是计算。
    probe:
      # 只取这些引擎的记录。空 = 全取。
      engines: []
      # 每条进 prompt 的截断长度。回答摘录很长,且前缀里有【模型】【临时对话】标记。
      excerpt_max_chars: 260
      max_candidates_in_prompt: 8
    keyword:
      # 只收有量证据的词——没有量的 query 行既不是痛点也不是需求信号,
      # 它只是「有人在某处写下过这个字符串」。
      require_volume: true
      max_candidates_in_prompt: 8

# 站点事实层。产线从这里取已确认字段递进 prompt。
facts_file: "/Users/shiyuanniu/project/vivu_web/data/facts.json"

# ---------------------------------------------------------------------------
# fact boundary。【出处:Shawn 2026-08-13 拍板「fact boundary 可以放宽」→
# 「能力描述全放开,只锁死数字类」】
#
# 原口径:正文可引用的产品事实**只有** facts.json 里 status=已确认 的字段,
# 一个字都不许超出。那条线在 2026-08-05 立起来是对的——当时站点事实层刚单点化,
# 宁可写得少也不能让 CI 去守护假话。
#
# 但它把「说错」和「没登记」当成了同一件事。08-13 改稿时连撞两次:
#   ①「接上存储后新素材会自动进入可检索集合」—— 真的,但没登记,于是被绕开写成
#     「keeping that running is the product's problem」,读者根本读不出那是什么意思。
#   ②「素材不需要上传或搬迁」—— 真的,但没登记,于是只敢说「文件名与目录结构不变」,
#     而那句回答不了「老 NAS 要不要动」。
# 两次都不是防住了假话,是防住了真话。正确的成本分配是:真的东西照写,
# 编不出来的东西锁死——而编得最狠、代价最大的从来是数字。
#
# ⚠️ 放开的是**能力描述**,不是全部。下面 locked 那四类一个字没松,
#    理由是它们有共同点:错了没法靠常识发现,且直接影响商业判断。
# ⚠️ 代价写在明处:AEO 页现在可能比产品页说得多。两边漂移没有自动闸门,
#    只能靠人看。发现漂移时把新口径补回站点文案与 facts.json,不要把文章改弱。
# ---------------------------------------------------------------------------
facts_policy:
  # 能力类描述的口径。逐条进 prompt。
  capability_claims:
    - "产品能做什么、怎么接入、边界在哪 —— 按真实口径写,不必逐条先落进 facts.json。
       facts.json 仍然是**基准与参考**(站点与 AEO 页的对齐点),不再是能力描述的天花板。"
    - "判据从『有没有登记』换成『是不是真的』。拿不准一条能力是否属实,就不要写它 ——
       但『我没在 facts.json 里看到』本身不再是理由。"
    - "描述能力时仍然照 vivu_mention 的规矩来:贴上下文、2-3 句、不列清单。
       放开的是能说什么,不是能说多少。"
  # 锁死的四类。只能来自 facts.json 已确认字段;那里是 null 就一个字都不写。
  locked:
    - "定价 —— 任何价格、区间、档位,以及『便宜』『实惠』『性价比』这类等价说法"
    - "benchmark 数字 —— 准确率、召回、速度、索引耗时、省下多少时间,任何性能数字"
    - "具名客户与客户结果 —— 客户名、案例、推荐语、『某某团队用了以后……』"
    - "具名第三方集成 —— 具体网盘 / MAM / 剪辑软件 / CRM 的产品名。
       站点一个都没点名,点名之前必须先在 facts.json 登记出处。"

# ---------------------------------------------------------------------------
# 拒稿口径。【出处:Shawn 2026-08-12 拍板「放宽剪辑和生成的闸门 —— 只放宽产线」】
#
# 为什么要显式写出来:08-12 那轮两条选题全被拒,其中 xyz video generator 的
# 拒稿理由第一句是「该 query 的痛点形态是"生成视频",与
# claims.does_not_edit_or_generate 正面冲突」。也就是说执行体把
# **产品做不到这件事**当成了不能写的理由。
#
# 那是反的。搜 "ai powered video editor" 的人是真实的潜在读者,
# 他要的答案里本来就该包含「哪些工具做剪辑、哪些不做、Vivu 在这条链上负责哪一段」。
# 诚实说明 Vivu 不剪辑,是这篇文章的**内容**,不是它写不成的理由——
# prompt 里本来就有「诚实展开所有路线,包括不用 Vivu 的路线」那一条。
#
# ⚠️ 放宽的是**产线**,不是事实。facts.json 的
# claims.does_not_edit_or_generate 一个字都没动,它有站点出处、且是 J2 CI lint
# 的基准。正文仍然不许说 Vivu 会剪辑或生成——只是不再因为这件事整篇不写。
# ---------------------------------------------------------------------------
refusal_policy:
  # 只有这几种情形可以出 REFUSE 包。逐条进 prompt。
  valid_reasons:
    - "证据候选里没有一条能与该 query 的痛点形态吻合 —— 硬写只能靠编搜索者的处境"
    - "query 本身无法辨认意图(如含无法识别的占位词、乱码、单字母串),读不出人在问什么"
    - "如实回答该 query 必须引用 facts.json 里没有的产品事实(定价、benchmark、客户名)"
  # 明确**不是**拒稿理由的情形。这一节是本次放宽的正文。
  not_reasons:
    - "query 的意图落在 Vivu 能力之外(剪辑、生成、字幕、存储等) —— 照写,
       在正文里如实说明 Vivu 不做这件事、做的是哪一段,并诚实介绍别的路线"
    - "query 是宽泛的品类词或浏览词 —— 照写,给出该品类的诚实全景"
    - "该 query 的商业价值看起来不高 —— 那是签发环节的判断,不是写不写的判断"

article:
  # 文章硬要求,进 prompt 逐条执行
  language: "English"
  word_range: "600-900"
  # -------------------------------------------------------------------------
  # 结尾。【出处:Shawn 2026-08-13 拍板「去掉每一篇结尾的 Vivu's demo is
  # 30 minutes, on your footage.」】
  #
  # 原来这一句是**强制**的固定结尾(`demo_cta`),八篇一字不差地挂在最后。
  # 它和「Where Vivu fits」是同一个病的两个器官:一个把产品事实清单贴在文末,
  # 一个把同一句 CTA 贴在更后面。读者读到倒数第二段就知道后面是广告。
  #
  # ⚠️ 去掉的是**这条强制**,不是收尾。没有结尾要求,执行体会自己发明一句
  # 等价的 CTA(「Try it on your own footage today」),那等于换了个说法接着犯。
  # 所以这里换成一条正面要求:结尾必须收在**这一篇自己的判断**上。
  #
  # claims.demo_length(30 分钟、用你自己的素材)仍然是 facts.json 的已确认事实,
  # 该说的时候照说 —— 只是不再每篇末尾必须出现。
  # -------------------------------------------------------------------------
  ending: "收在这一篇自己的判断上:读者读完该怎么判断自己属于哪一边。
    不许有固定 CTA,也不许自己发明一句等价的(Try it on your own footage /
    Book a demo / See it in action 之类)。不邀约、不催促、不留钩子 ——
    最后一句是文章的一部分,不是转化按钮。"

  # -------------------------------------------------------------------------
  # Vivu 在正文里怎么出现。【出处:Shawn 2026-08-13 拍板「让 vivu 的描述贴合上下文,
  # 且只是简短的 2-3 句隐藏在文中。内容不一定局限在 video search/indexing,
  # 也可以说 vivu 基于 index 怎么解决文中提到的问题」】
  #
  # 为什么要:前四篇每一篇都长出一段独立的 Vivu 小节,内容几乎逐字雷同——
  # 把 facts.json 的已确认字段从头背到尾。四篇的那一段并排看:
  #   how-to-find-an-old-brand-video「## Search the footage itself」
  #   livestream-highlights        「## Search the archive by what was said」
  #   search-video-by-spoken-words 「## Tools built to retrieve from footage」
  #   video-editing-made-easy      「## Where Vivu fits」
  # 标题四个写法,内容同一份清单,连顺序都一样:连存储 → 入库索引一次 →
  # 返回带上下文的时间点 → 不剪辑不生成 → 素材私有 → MCP → 有 API 但不需要开发者。
  #
  # 病根在 prompt,不在执行体:facts.json 被交代成「唯一可用的事实集合,
  # 一个字都不许超出」,但没有任何一条规则说**用几条、放哪儿、跟这一篇的上下文
  # 怎么挂钩**。上限被当成了清单,于是默认解法就是开一个 H2 把它倒完。
  # 那不是文章的一部分,是贴在文章末尾的产品说明书:读者一眼认出是广告就跳过,
  # answer engine 也拿不到任何这一篇独有的东西——四篇在这一段上完全可替换。
  #
  # 注意这里收紧的是**篇幅与位置**,放开的是**角度**:
  #   收紧 —— 全文谈 Vivu 的句子有上限,且不许拥有自己的小节。
  #   放开 —— 允许把已确认事实落到这一篇的具体问题上(「索引已经在那儿,
  #           所以文里那件事变成一次查询」),不再只能逐条复述字段本身。
  # 事实边界一个字没动:能说的仍然只有 facts.json 的已确认字段,
  # 推论只能推「这条事实用在这个处境上会怎样」,不许推出新能力、新数字、新集成。
  # -------------------------------------------------------------------------
  vivu_mention:
    # 全文提到 Vivu 的句子上限。2026-08-13 起没有例外了:原来结尾那句强制
    # demo_cta 不计入,而那句已经随 article.ending 一起去掉,全文就这 3 句。
    max_sentences: 3
    # 逐条进 prompt。
    rules:
      - "不许有以 Vivu 为主语的小节标题(Where Vivu fits / How Vivu helps /
         Enter Vivu / The Vivu approach 之类),也不许把某个小节整段写成 Vivu 介绍。
         换个中性标题接着倒清单同样不算数 —— 判据是那一节读起来是不是产品说明。"
      - "路线小节写**品类**,不写 Vivu。『在已有素材上加一层按内容检索』是一条路线,
         诚实讲它的形态、代价和边界;Vivu 是这条路线里的一个实现,不是这条路线本身。"
      - "这 2-3 句要长在正文里:接在它回答的那段话后面,读起来是那一段的下一句。
         位置由内容决定 —— 哪一段最需要它就放哪一段,不许固定落在文末。"
      - "内容必须贴这一篇的具体问题。写『索引已经在那儿,所以文中这件事变成一次查询』,
         不要写『Vivu 是什么』。同一句话能原样搬到另一篇里,就说明它没贴上下文。"
      - "不许连着列产品能力。存储连接、入库索引一次、MCP、API、不需要开发者、
         素材私有、不剪辑不生成 —— 这几条里只挑与本篇直接相关的 1-2 条,
         其余一个字都不要提。读者关心的是他那件事怎么办,不是功能表。"
      - "这几句照 facts_policy 的边界写:能力描述按真实口径,数字类四项锁死。
         能力写得具体一点是好事 —— 『新素材进来自动就能搜』比
         『索引是产品的事』强得多,后者读者根本读不出是什么意思。"
      - "同一次运行的几篇之间,这几句不许互相雷同:问题不一样,切入点就得不一样。"

telegram:
  # 通知消息(不是文章本体——文章太长,群里只发摘要与路径)
  max_chars_per_message: 3500

# ---------------------------------------------------------------------------
# 发布(j1_publish.py)。2026-08-10 Shawn 拍板:AEO 内容复用站点已有的 blog 管线,
# 不另建 /aeo 渲染器——原契约的 content/aeo/ 目录站点根本没有代码去读它,
# 按那条路发出去的「发布链接」是 404,而台账会记成已发布。
#
# 本节只描述**文件落到哪、URL 怎么拼**。回写台账不在这里:那是站点 build 里
# scripts/aeo-ledger-writeback.mjs 的活,两边都从 frontmatter 的 slug 拼 URL,
# 口径必须一致,否则台账会记下一条点开是 404 的已发布链接。
# ---------------------------------------------------------------------------
publish:
  # 站点内容目录。AEO 页与自有博文混住,靠 frontmatter 的 AEO 字段区分。
  posts_dir: "/Users/shiyuanniu/project/vivu_web/src/content/posts"
  site: "https://vivu.ai"
  url_prefix: "/blog"
  author: "Vivu"
  # meta description 上限。超了在搜索结果里会被截断,不如自己先收住。
  description_max_chars: 155
