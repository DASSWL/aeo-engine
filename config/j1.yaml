# ---------------------------------------------------------------------------
# J1 AEO 内容产线(j1_runner.py)的全部业务值。
#
# 出处:Build Spec · Phase 3「J1 证据生产」+ 2026-08-06 Shawn 拍板
# 「把流程建立起来,同时计入台账」。
#
# 与 J4 的 outreach.yaml 同一哲学:脚本内不写死任何业务值。
# 闸门本身不在这里——闸门只存在于 j1_evidence.py(证据解析)与 gates.yaml(邻域),
# 本文件只管队列怎么排、证据怎么筛、产出怎么落。
# ---------------------------------------------------------------------------

queue:
  # 只自动产这一类。评估式选题涉及竞品对比口径,对比页有邻域闸门,都等真人。
  types_allowed: ["痛点级任务式"]
  # 数据来源白名单:只有「市场在问」形态的来源能当选题。
  # Keyword Planner / SERP 观察刻意不在内——那两条链是补量与占位观察,
  # 进来的是短头词(如 yahoo search video),不是能回答的问法。
  # 首轮 dry-run(2026-08-06)实测:不加这条白名单,队列头两名就是 KP 导航词。
  # 这就是裁决①的代价那句话:「排 AEO 内容优先级前必须先看数据来源列」。
  sources_allowed: ["探测问题", "A1 扫描", "买家原话", "AI 建议", "Search Console"]
  # 状态黑名单(命中即跳过)。Query 库当前用「候选」等值,黑名单比白名单稳:
  # 将来加新状态值时默认进队列,归档类值加进这里。
  statuses_exclude: ["已归档"]
  # 每次运行最多写几篇。周频 × 2 = 每周至多 2 篇待签发草稿,
  # 签发是真人动作,产得比签得快只会堆积库存。
  max_per_run: 2

evidence:
  # 信号原文里带这些标记的行不进证据候选——那不是本人说的话,是名单命中条件。
  # 与 J4 evidence_gate 对 Apollo 行的降级判定同一出处(outreach.yaml)。
  exclude_markers: ["非原文引用"]
  # 进 prompt 的证据候选上限。太多会稀释配对质量,而且 quote 全文很长。
  max_candidates_in_prompt: 12
  # 每条 quote 进 prompt 的截断长度(字符)
  quote_max_chars: 300

  # -------------------------------------------------------------------------
  # 降级证据源。【出处:Shawn 2026-08-12 拍板「放宽生产条件,如果没有水箱可用的,
  # 从 ai probe 和 keywords query 找相关」】
  #
  # 为什么要:水箱 109 行里能当证据的只有 15 条——83 条带「非原文引用」标记
  # (Apollo 名单命中,不是本人发言)、11 条缺原话或缺链接。而进 prompt 的上限是 12,
  # 于是几乎每篇文章看到的都是同一批证据。已发布 3 篇总共只用了 3 条不同的 SIG。
  # 可用证据最后一次新增是 2026-08-09(2 条);08-10 进来 33 行,一条可用的都没有。
  #
  # ⚠️ 三档证据**不是同一种东西**,这一点必须一路传到 prompt、台账和 outbox 头部,
  #    否则「挂了证据编号」会变成一句空话:
  #      SIG(水箱) —— 买家**本人说的话**。唯一能校准痛点形态的东西。
  #      PRB(探测) —— **引擎生成的内容**。它说明「现在搜这个问题的人会看到什么答案」,
  #                    即这篇文章要压过谁。**不是买家痛点,更不是产品事实。**
  #      KW (Query 库) —— 一个**检索需求信号**。它说明有人搜这个词,
  #                    **不说明他为什么搜、也不说明他难在哪**。
  #
  #    把 PRB 当买家痛点用,等于拿 ChatGPT 对买家的猜测冒充买家的话;
  #    把 PRB 里的产品描述当事实用,等于把引擎的幻觉洗进 vivu.ai 的正文。
  #    facts.json 仍然是正文里产品事实的**唯一**来源,这条一个字没松。
  # -------------------------------------------------------------------------
  fallback:
    enabled: true
    # 降级证据只在水箱一条都配不上时用。这是 prompt 里的规则(靠 claude 判相关),
    # 脚本这边只负责把三档都递进去并标清楚档位——相关不相关是判断,不是计算。
    probe:
      # 只取这些引擎的记录。空 = 全取。
      engines: []
      # 每条进 prompt 的截断长度。回答摘录很长,且前缀里有【模型】【临时对话】标记。
      excerpt_max_chars: 260
      max_candidates_in_prompt: 8
    keyword:
      # 只收有量证据的词——没有量的 query 行既不是痛点也不是需求信号,
      # 它只是「有人在某处写下过这个字符串」。
      require_volume: true
      max_candidates_in_prompt: 8

# 站点事实层。正文可引用的产品事实只有这个文件里 status=已确认 的字段。
# 无出处不写——facts.json 自己的 hard_rule,产线只是执行它。
facts_file: "/Users/shiyuanniu/project/vivu_web/data/facts.json"

# ---------------------------------------------------------------------------
# 拒稿口径。【出处:Shawn 2026-08-12 拍板「放宽剪辑和生成的闸门 —— 只放宽产线」】
#
# 为什么要显式写出来:08-12 那轮两条选题全被拒,其中 xyz video generator 的
# 拒稿理由第一句是「该 query 的痛点形态是"生成视频",与
# claims.does_not_edit_or_generate 正面冲突」。也就是说执行体把
# **产品做不到这件事**当成了不能写的理由。
#
# 那是反的。搜 "ai powered video editor" 的人是真实的潜在读者,
# 他要的答案里本来就该包含「哪些工具做剪辑、哪些不做、Vivu 在这条链上负责哪一段」。
# 诚实说明 Vivu 不剪辑,是这篇文章的**内容**,不是它写不成的理由——
# prompt 里本来就有「诚实展开所有路线,包括不用 Vivu 的路线」那一条。
#
# ⚠️ 放宽的是**产线**,不是事实。facts.json 的
# claims.does_not_edit_or_generate 一个字都没动,它有站点出处、且是 J2 CI lint
# 的基准。正文仍然不许说 Vivu 会剪辑或生成——只是不再因为这件事整篇不写。
# ---------------------------------------------------------------------------
refusal_policy:
  # 只有这几种情形可以出 REFUSE 包。逐条进 prompt。
  valid_reasons:
    - "证据候选里没有一条能与该 query 的痛点形态吻合 —— 硬写只能靠编搜索者的处境"
    - "query 本身无法辨认意图(如含无法识别的占位词、乱码、单字母串),读不出人在问什么"
    - "如实回答该 query 必须引用 facts.json 里没有的产品事实(定价、benchmark、客户名)"
  # 明确**不是**拒稿理由的情形。这一节是本次放宽的正文。
  not_reasons:
    - "query 的意图落在 Vivu 能力之外(剪辑、生成、字幕、存储等) —— 照写,
       在正文里如实说明 Vivu 不做这件事、做的是哪一段,并诚实介绍别的路线"
    - "query 是宽泛的品类词或浏览词 —— 照写,给出该品类的诚实全景"
    - "该 query 的商业价值看起来不高 —— 那是签发环节的判断,不是写不写的判断"

article:
  # 文章硬要求,进 prompt 逐条执行
  language: "English"
  word_range: "600-900"
  demo_cta: "Vivu's demo is 30 minutes, on your footage."

telegram:
  # 通知消息(不是文章本体——文章太长,群里只发摘要与路径)
  max_chars_per_message: 3500

# ---------------------------------------------------------------------------
# 发布(j1_publish.py)。2026-08-10 Shawn 拍板:AEO 内容复用站点已有的 blog 管线,
# 不另建 /aeo 渲染器——原契约的 content/aeo/ 目录站点根本没有代码去读它,
# 按那条路发出去的「发布链接」是 404,而台账会记成已发布。
#
# 本节只描述**文件落到哪、URL 怎么拼**。回写台账不在这里:那是站点 build 里
# scripts/aeo-ledger-writeback.mjs 的活,两边都从 frontmatter 的 slug 拼 URL,
# 口径必须一致,否则台账会记下一条点开是 404 的已发布链接。
# ---------------------------------------------------------------------------
publish:
  # 站点内容目录。AEO 页与自有博文混住,靠 frontmatter 的 AEO 字段区分。
  posts_dir: "/Users/shiyuanniu/project/vivu_web/src/content/posts"
  site: "https://vivu.ai"
  url_prefix: "/blog"
  author: "Vivu"
  # meta description 上限。超了在搜索结果里会被截断,不如自己先收住。
  description_max_chars: 155
