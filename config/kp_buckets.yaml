# AEO Engine · Keyword Planner 桶中值 → 区间的还原表
#
# 解决的问题（2026-08-05 实测发现）：
#   Keyword Planner 的**界面显示区间**（`1K – 10K`），
#   但**导出的 CSV 把区间换成了桶中值整数**（`5000`）。
#   keyword_volume.py 若照单全收，会把 `5000` 当精确值写进 `月搜索量`——
#   Phase 0 那条「区间不折算成任何具体数字，折算等于伪造精度」的禁令，
#   就在 Google 的导出层被绕过去了，而我们的脚本会忠实地把假精度记成基准。
#
# 处置（Shawn 2026-08-05 拍板）：解冻 Phase 0 字段表，Query 库加第 8 列
#   `搜索量区间`（rich_text）。桶化的文件走这一列，`月搜索量` 留空。
#
# ⚠️ 这张表是**推断**，必须先确认文件真的被桶化了才能用。
#    判据见下方 detection：整份文件的全部取值都落在桶集合里才算桶化。
#    有投放的账号返回的是任意整数（4830、12100 这种），一个就能证伪。
#    宁可当成精确值（那是它本来的样子），也不要把真实测量值降级成区间。

meta:
  version: "0.1"
  status: approved
  drafted_at: "2026-08-05"
  evidence: >-
    2026-08-05 实测，账号 215-156-2899，Discover new keywords 跑
    `video search` + `video asset management`，37 条结果。
    界面与导出 CSV 逐条对照，四档已直接验证：
      video search                    界面 1K – 10K    CSV 5000
      video asset management          界面 10 – 100    CSV 50
      video asset management software 界面 100 – 1K    CSV 500
      reverse video search            界面 10K – 100K  CSV 50000
    且 37 条里只出现过这 4 个取值，全为 5×10^n。

detection:
  # 桶化判据：整份文件里**每一个**非空搜索量取值都必须落在 buckets 的键里。
  # 出现任何一个不在表里的数 → 判为精确值文件，整份走原路径，不做任何还原。
  # 这个判据是刻意保守的：漏判（把桶化当精确）的代价是假精度进基准，
  # 误判（把精确当桶化）的代价是丢掉真实测量值。两个都不能接受，
  # 所以再加一条行数下限——样本太少时 4 个数的巧合是可能的。
  min_rows: 5

buckets:
  # 已直接验证的四档
  50: "10 – 100"
  500: "100 – 1K"
  5000: "1K – 10K"
  50000: "10K – 100K"
  # 按同一规律外推，**未实测**。哪天真出现了，回来对着界面核一遍再去掉这行注记。
  500000: "100K – 1M"        # 【外推未实测】
  5000000: "1M – 10M"        # 【外推未实测】

# 区间 → 排序下界。供 serp_scan 一类需要「谁的量更大」的地方排序用。
#
# 用**下界**而不是中值，是刻意的：下界是「至少这么多」，是这条区间能保证的事实。
# 拿中值（1K–10K → 5000）去跟一个精确值 200 比，是拿推断压过测量；
# 拿下界（1000）比，仍然赢，但赢在一个不会错的数上。
#
# ⚠️ 这个数**只用于排序，永不写库**。写进 Query 库的仍然只有区间字符串本身。
sort_floor:
  "10 – 100": 10
  "100 – 1K": 100
  "1K – 10K": 1000
  "10K – 100K": 10000
  "100K – 1M": 100000
  "1M – 10M": 1000000

notes:
  - "桶化文件的 `月搜索量` 一律留空。区间不是数字，硬塞进 number 字段就是伪造精度。"
  - "✅ 2026-08-05 Shawn 拍板：serp_scan 已改为同时读 `搜索量区间`，
     按上面的 sort_floor 排序。此前它只看 `月搜索量`，
     桶化来的行因此永远排在最后——明明有量级信息，只是不在那一列。"
  - "区间字符串逐字取自本表，不做任何本地化改写——它要能和界面上看到的对上。"
